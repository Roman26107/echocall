name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: 123456:telegram-bot-token
      BOT_USERNAME: example_bot
      DATABASE_URL: 'sqlite:///:memory:'
      ADMIN: '0'
      DEBUG: 'false'
      DATA_ACCESS_MODE: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Browser runtime tests
        run: node --test tests/call_runtime.test.js tests/call_tab_coordinator.test.js tests/embedded_self_view.test.js
      - name: Validate Compose examples
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --env-file .env.rf.example -f docker-compose.rf.yml config --quiet
          docker compose --env-file .env.foreign.example -f docker-compose.foreign.yml config --quiet
