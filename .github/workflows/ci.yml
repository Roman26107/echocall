name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      BOT_TOKEN: 123456:telegram-bot-token
      BOT_USERNAME: example_bot
      DATABASE_URL: 'sqlite:///:memory:'
      ADMIN: '0'
      DEBUG: 'false'
      DATA_ACCESS_MODE: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Browser runtime tests
        run: node --test tests/call_runtime.test.js tests/call_tab_coordinator.test.js tests/embedded_self_view.test.js
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts docker -type f -name '*.sh' -print0)
      - name: Validate Compose examples
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --env-file .env.rf.example -f docker-compose.rf.yml config --quiet
          docker compose --env-file .env.foreign.example -f docker-compose.foreign.yml config --quiet

  services:
    name: PostgreSQL / Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: echocall_test
          POSTGRES_USER: echocall_test
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echocall_test -d echocall_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://echocall_test:ci-only-postgres-password@127.0.0.1:5432/echocall_test
      REDIS_URL: redis://127.0.0.1:6379/0
      INTERNAL_API_TOKEN: ci-only-internal-token-at-least-32-characters
      BOT_TOKEN: 123456:telegram-bot-token
      BOT_USERNAME: example_bot
      DATA_ACCESS_MODE: direct
      ECHOCALL_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply migrations and compare model metadata
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Real service integration
        run: python -m unittest discover -s tests -p 'test_service_integration.py' -v
      - name: Build unprivileged application image
        run: |
          docker build -t echocall-ci .
          test "$(docker run --rm -e DATA_ACCESS_MODE=none echocall-ci id -u)" = 10001

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
