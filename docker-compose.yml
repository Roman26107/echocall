services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calls_tg}
      POSTGRES_USER: ${POSTGRES_USER:-calls_tg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-calls_tg}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-calls_tg}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-calls_tg}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-calls_tg}
    command:
      - gunicorn
      - web.app:app
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --threads
      - "4"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --access-logformat
      - "%(m)s %(s)s %(L)s"
      - --error-logfile
      - "-"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-calls_tg}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-calls_tg}
    command: ["python", "-m", "bot.app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/static:/app/web/static:ro

volumes:
  postgres_data:
